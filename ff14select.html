<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>難易度選択</title>
<link rel="stylesheet" href="css/ff14.css">
</head>
<body>

<div class="logo">

    <img src="images/ff14-logo-crystal.png"
         class="logo-crystal">

    <div class="title">
        EORZEA
    </div>

    <div class="subtitle">
        Knowledge Trial
    </div>

</div>
<div class="difficulty">
<div class="command" onclick="selectDifficulty('easy')">
◆ Adventurer
</div>

<div class="command" onclick="selectDifficulty('normal')">
◆ Veteran
</div>

<div class="command" onclick="selectDifficulty('hard')">
◆ Savage
</div>

<div class="command selected" onclick="startQuiz()">
▶ Commence
</div>
</div>
  <!-- 管理者専用エリア -->
 <div id="admin-area">
        <h2>Administrator</h2>

        <div class="admin-command" onclick="goCreateQuiz()">
            Create Question
        </div>

        <div class="admin-command" onclick="goListQuiz()">
            Question List
        </div>
 </div>


<!-- 効果音 -->
<audio id="se" src="https://soundeffect-lab.info/sound/button/mp3/button01.mp3"></audio>

<script>
// 管理者ログインチェック
const isAdmin = localStorage.getItem("admin") === "1";
if (!isAdmin) {
  document.getElementById("admin-area").style.display = "none";
}

let selected = "easy";

function playSE() {
  const se = document.getElementById("se");
  se.currentTime = 0;
  se.play();
}

function selectDifficulty(level) {
  playSE();
  selected = level;

  const commands = document.querySelectorAll(".command");
  commands.forEach(cmd => cmd.classList.remove("selected"));

  if (level === "easy") commands[0].classList.add("selected");
  if (level === "normal") commands[1].classList.add("selected");
  if (level === "hard") commands[2].classList.add("selected");
}

function startQuiz() {
  playSE();
  location.href = "quiz.html?difficulty=" + selected;
}

function goCreateQuiz() {
  if (!isAdmin) {
    alert("管理者のみアクセスできます");
    location.href = "login.html";
    return;
  }
  playSE();
  location.href = "input.html?difficulty=" + selected;
}

function goListQuiz() {
  if (!isAdmin) {
    alert("管理者のみアクセスできます");
    location.href = "login.html";
    return;
  }
  playSE();
  location.href = "admin-list.html";
}
</script>

</body>
</html>
